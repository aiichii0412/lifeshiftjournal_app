<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>今日のページ｜28日間ジャーナリング</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="inner">
    <a class="back" href="index.html">← 28日間の一覧</a>
    <div style="margin-top:10px"><span class="daytag" id="daytag"></span><span class="weekname" id="weekname"></span></div>
    <h1 id="title"></h1>
  </div>
  <div class="arch"></div>
</header>

<main class="wrap" id="main"></main>

<script src="data/days.js"></script>
<script src="app.js"></script>
<script>
(function () {
  // 写真の保存はまだつながっていないので、お試し表示にしている。つなげたら true にする。
  var STORAGE_READY = false;
  var e = LSJ.esc;
  var n = parseInt(new URLSearchParams(location.search).get("d"), 10);
  if (!(n >= 1 && n <= 28)) n = 1;
  var d = DAYS[n - 1];

  document.title = "Day" + d.n + "｜28日間ジャーナリング";
  document.getElementById("daytag").textContent = "Day" + d.n;
  document.getElementById("weekname").textContent = "WEEK " + d.week + "　" + WEEKS[d.week];
  document.getElementById("title").textContent = d.title;

  var h = "";
  h += '<section class="card"><h2>今日のひと言</h2>' +
       d.guide.map(function (p) { return "<p>" + e(p) + "</p>"; }).join("") + "</section>";

  h += '<section class="card work"><div class="ico">📖</div><div><div class="lead">本を開いて、書きましょう</div>' +
       '<div class="name">本の ' + e(d.work) + '</div></div></section>';

  h += '<details class="alt"><summary>本がないときは</summary><div class="body">' +
       d.alt.map(function (p) { return "<p>" + e(p) + "</p>"; }).join("") + "</div></details>";

  if (d.after) h += '<section class="card"><p>' + e(d.after) + "</p></section>";

  h += '<section class="card upload"><h2>📷 書いたページを、写真で送る</h2>' +
       "<p>書いたページ(本でも、ノートでも)を写真に撮って、送ってください。</p>" +
       '<div class="safe">保存した写真は、あなた本人と市居愛だけが見られます。安心してくださいね。</div>' +
       '<input type="file" id="file" accept="image/*" multiple hidden>' +
       '<button class="btn" id="pick" type="button">写真を選ぶ・撮る</button>' +
       '<div class="thumbs" id="thumbs"></div>' +
       (STORAGE_READY ? "" : '<p class="note">※いまはお試し表示です。この画面では、まだ保存されません。</p>') +
       "</section>";

  if (d.pdf) {
    h += '<section class="card pdf"><h2>📎 今日の特典 PDF</h2><div class="ttl">' + e(d.pdf.title) + "</div>" +
         (d.pdf.url
           ? '<a class="btn ghost" href="' + e(d.pdf.url) + '" target="_blank" rel="noopener">PDF を開く</a>'
           : '<p class="note">リンクは準備中です。</p>') + "</section>";
  }

  var isDone = !!LSJ.doneSet()[n];
  h += '<div class="done-row"><button class="btn ghost donebtn' + (isDone ? " on" : "") + '" id="done" type="button">' +
       (isDone ? "✓ 今日はここまで(記録しました)" : "今日はここまで") + "</button></div>";

  h += '<nav class="nav"><a class="' + (n > 1 ? "" : "off") + '" href="day.html?d=' + (n - 1) + '">← Day' + (n - 1) + "</a>" +
       '<a class="' + (n < 28 ? "" : "off") + '" href="day.html?d=' + (n + 1) + '">Day' + (n + 1) + " →</a></nav>";

  document.getElementById("main").innerHTML = h;

  // 写真のプレビュー(お試し)
  var file = document.getElementById("file"), thumbs = document.getElementById("thumbs");
  document.getElementById("pick").onclick = function () { file.click(); };
  file.onchange = function () {
    thumbs.innerHTML = "";
    Array.prototype.forEach.call(file.files, function (f) {
      var img = document.createElement("img");
      img.src = URL.createObjectURL(f); img.alt = "選んだ写真";
      thumbs.appendChild(img);
    });
  };

  document.getElementById("done").onclick = function () {
    var on = !LSJ.doneSet()[n];
    LSJ.setDone(n, on);
    this.classList.toggle("on", on);
    this.textContent = on ? "✓ 今日はここまで(記録しました)" : "今日はここまで";
  };
})();
</script>
</body>
</html>
